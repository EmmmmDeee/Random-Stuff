[package]
name = "hse"
version = "0.1.0"
edition = "2021"
description = "Huntsman Search Engine — search the red-team detection catalog (defensive)."
license = "MIT"

# Minimal, auditable dependency tree — only JSON deserialization is pulled in.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

# Target-specific: aarch64 (ARM64, Termux/Android, etc.)
[target.aarch64-unknown-linux-gnu]
# No special configuration needed; uses defaults
