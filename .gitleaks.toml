# Gitleaks configuration for the repository.
# This excludes files from secret scanning that are known to produce false positives
# (e.g., security analysis documentation containing keywords like "credentials", "secrets").

[[allowlist]]
description = "Exclude analysis directory (contains security documentation, not secrets)"
paths = [
  "analysis/.*",
]
regexes = [
  # Documentation keywords that appear in malware/security analysis
  # These are legitimate content, not exposed secrets.
  "what_it_reveals",
  "defensive_counter",
  "detection_signal",
  "credentials",
  "secrets",
  "carding",
  "ransomware",
]
