# Gitleaks configuration for the repository.
# Excludes files and patterns known to produce false positives
# (analysis directory contains security research with keywords like those below).

[[allowlist]]
description = "Exclude analysis directory (contains security research documentation)"
paths = [
  "analysis/.*",
]
regexes = [
  # Documentation keywords that appear in security research analysis
  # These are legitimate research content, not exposed data.
  "what_it_reveals",
  "defensive_counter",
  "detection_signal",
  "carding",
  "ransomware",
]
