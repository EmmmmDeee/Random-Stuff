name: Daily Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

# Cancel a superseded run when new commits are pushed, so queued runs don't
# pile up and compete for scarce runners.
concurrency:
  group: security-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # All checks run as sequential steps in ONE job so the whole suite needs only
  # a single runner. Splitting these into 5 parallel jobs requires 5 concurrent
  # runners; on runner-constrained accounts the extra jobs sit queued and get
  # cancelled, failing the run for reasons unrelated to the checks themselves.
  security-checks:
    runs-on: ubuntu-latest
    name: Security Checks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out PR head commit
        if: github.event_name == 'pull_request'
        run: git checkout --quiet "${{ github.event.pull_request.head.sha }}"

      # --- 1. Credential scan ------------------------------------------------
      - name: Scan for exposed credentials
        run: |
          set +e
          set -o pipefail

          echo "🔍 Scanning recent git history for exposed secrets..."

          # Match real secret FORMATS, not the words "password"/"token"/"secret"
          # — this repo is a security framework whose documentation discusses
          # those words constantly, so a bare-keyword grep matches its own docs
          # (false positives), not leaked credentials. Lightweight, not a
          # substitute for a dedicated scanner (gitleaks/trufflehog); limited to
          # recent commits to avoid the cost of `git log -p --all`.
          FOUND=0
          SCAN_DEPTH=200
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MERGE_BASE=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
            RANGE="$MERGE_BASE..${{ github.event.pull_request.head.sha }}"
            HISTORY_CMD=(git log -p "$RANGE")
            FILES_CMD=(git log --diff-filter=A --name-only --pretty= "$RANGE")
          else
            RANGE=HEAD
            HISTORY_CMD=(git log -p -n "$SCAN_DEPTH" "$RANGE")
            FILES_CMD=(git log -n "$SCAN_DEPTH" --diff-filter=A --name-only --pretty= "$RANGE")
          fi

          # High-signal credential formats that essentially never appear in prose.
          SECRET_RE='AKIA[0-9A-Z]{16}'                                 # AWS access key id
          SECRET_RE="$SECRET_RE"'|gh[posur]_[0-9A-Za-z]{36}'           # GitHub tokens
          SECRET_RE="$SECRET_RE"'|github_pat_[0-9A-Za-z_]{50,}'        # GitHub fine-grained PAT
          SECRET_RE="$SECRET_RE"'|xox[baprs]-[0-9A-Za-z-]{10,}'        # Slack tokens
          SECRET_RE="$SECRET_RE"'|AIza[0-9A-Za-z_-]{35}'               # Google API key
          SECRET_RE="$SECRET_RE"'|-----BEGIN [A-Z ]*PRIVATE KEY-----'  # private key blocks
          SECRET_RE="$SECRET_RE"'|eyJ[0-9A-Za-z_-]{10,}\.[0-9A-Za-z_-]{10,}\.[0-9A-Za-z_-]{10,}'  # JWT

          "${HISTORY_CMD[@]}" | grep -nE "$SECRET_RE" > /tmp/matches.txt
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "⚠️  WARNING: Potential exposed secret detected!"
            echo "Matches:"
            head -20 /tmp/matches.txt
            FOUND=1
          elif [ "$status" -eq 1 ]; then
            echo "✅ No high-signal secret formats found in recent history"
          else
            echo "::error::Secret history scan failed"
            exit "$status"
          fi

          # Credential-bearing FILES that were ADDED (not prose that mentions the
          # words) — anchored to real key/secret file extensions and names.
          "${FILES_CMD[@]}" \
            | grep -nE '(^|/)(\.env(\..*)?|id_rsa|id_ed25519|.*\.pem|.*\.p12|.*\.pfx|.*\.pkcs12)$' \
            > /tmp/files.txt
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "⚠️  WARNING: Credential-bearing files were committed:"
            cat /tmp/files.txt
            FOUND=1
          elif [ "$status" -ne 1 ]; then
            echo "::error::Credential file history scan failed"
            exit "$status"
          fi

          if [ "$FOUND" -ne 0 ]; then
            echo "::error::Credentials detected in git history"
            echo "If you committed credentials by accident:"
            echo "1. Rotate the compromised credentials IMMEDIATELY (assume exposed)."
            echo "2. Remove the secret from history with git-filter-repo:"
            echo "     git filter-repo --path <secret-file> --invert-paths"
            echo "   (git filter-branch is deprecated; prefer git-filter-repo.)"
            echo "3. Coordinate the history rewrite with repo admins — the protected"
            echo "   'main' branch disallows direct force pushes, so this requires an"
            echo "   admin-run rewrite or a temporary protection bypass, not a"
            echo "   'git push -f origin main' from a contributor."
          fi

          exit $FOUND

      # --- 2. Commit signatures ---------------------------------------------
      - name: Verify commit signatures
        if: always()
        run: |
          echo "🔐 Verifying commit signatures..."

          # For pull requests, inspect the commits introduced by the branch
          # rather than recent commits on main. For other events, fall back to
          # the most recent commits on HEAD.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MERGE_BASE=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
            RANGE="$MERGE_BASE..${{ github.event.pull_request.head.sha }}"
            LABEL="commits in $RANGE"
            COMMITS_CMD=(git log --format='%H' "$RANGE")
          else
            RANGE=HEAD
            LABEL="last 20 commits on HEAD"
            COMMITS_CMD=(git log --format='%H' -20 "$RANGE")
          fi
          echo "Checking signatures for $LABEL"

          # Feed the loop via process substitution rather than a pipe so that
          # UNSIGNED set inside the loop persists (a piped `while` runs in a
          # subshell and would discard the assignment).
          UNSIGNED=0
          INVALID=0
          while read -r commit; do
            status=$(git show --quiet --format='%G?' "$commit")
            case "$status" in
              G) ;;
              N)
                echo "⚠️  Unsigned commit: $commit"
                UNSIGNED=1
                ;;
              *)
                echo "⚠️  Commit has invalid or untrusted signature: $commit ($status)"
                INVALID=1
                ;;
            esac
          done < <("${COMMITS_CMD[@]}")

          if [ "$UNSIGNED" -eq 1 ]; then
            echo "::warning::Some commits are not signed"
            echo "Run: git commit -S -m 'message' to sign future commits"
          fi
          if [ "$INVALID" -eq 1 ]; then
            echo "::warning::Some commit signatures are present but invalid or untrusted"
            echo "Verify signer trust, key validity, or SSH allowed signers configuration."
          fi
          if [ "$UNSIGNED" -eq 0 ] && [ "$INVALID" -eq 0 ]; then
            echo "✅ All checked commits have valid signatures"
          else
            true
          fi

      # --- 3. Branch protection (advisory) ----------------------------------
      - name: Verify branch protection
        if: always()
        run: |
          echo "🛡️  Verifying branch protection rules..."
          echo "Expected for 'main': PR reviews, status checks, commit signatures."
          echo "Note: GitHub branch protection settings must be verified in the UI"
          echo "See: Settings → Branches → Branch protection rules → 'main'"

      # --- 4. Repository integrity ------------------------------------------
      - name: Repository integrity
        if: always()
        run: |
          echo "📊 Verifying checked-out repository contents..."

          # Compare the working tree against the checked-out commit rather than
          # a static committed baseline. That catches unexpected in-run mutation
          # without failing on ordinary, intentional repository changes in PRs.
          git update-index -q --refresh

          if git diff --quiet --ignore-submodules=all HEAD -- . && \
             git diff --cached --quiet --ignore-submodules=all HEAD -- .; then
            echo "✅ Repository integrity verified"
          else
            echo "⚠️  Repository integrity check failed"
            echo "Tracked-file drift in working tree versus HEAD:"
            git diff --name-status HEAD -- . || true
            echo ""
            echo "Tracked-file drift in index versus HEAD:"
            git diff --cached --name-status HEAD -- . || true
            echo ""
            echo "Working tree diff versus HEAD:"
            git diff HEAD -- . || true
            echo ""
            echo "Index diff versus HEAD:"
            git diff --cached HEAD -- . || true
            exit 1
          fi

      # --- 5. Unauthorized access -------------------------------------------
      - name: Check for unauthorized access
        if: always()
        run: |
          echo "👤 Analyzing commit authorship..."
          echo "Recent commit authors:"
          git log --oneline -100 --pretty='%an <%ae>' | sort | uniq -c | sort -rn
          echo ""
          echo "⚠️  Review the list above for unexpected authors"
          echo "If you see unfamiliar names, run: git log --all --oneline to investigate."
